<text x="300.0" y="44.0" text-anchor="middle" font-family="Arial" font-size="16" fill="white">Início</text>
<rect x="155" y="95" width="290" height="60" rx="6" fill="#eef3fa" stroke="#7186a1"/>
<text x="300.0" y="130.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f3046">Aluno preenche e envia</text>
<rect x="155" y="190" width="290" height="60" rx="6" fill="#eef3fa" stroke="#7186a1"/>
<text x="300.0" y="225.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f3046">POST /api/assincrono</text>
<polygon points="300.0,285 405,335.0 300.0,385 195,335.0" fill="#fff7e2" stroke="#9b7826"/>
<text x="300.0" y="340.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f3046">Dados válidos?</text>
<rect x="455" y="304" width="170" height="64" rx="32.0" fill="#194374" stroke="#7186a1"/>
<text x="540.0" y="330.5" text-anchor="middle" font-family="Arial" font-size="16" fill="white">Erro 400</text>
<text x="540.0" y="351.5" text-anchor="middle" font-family="Arial" font-size="16" fill="white">Fim</text>
<rect x="155" y="425" width="290" height="64" rx="6" fill="#eef3fa" stroke="#7186a1"/>
<text x="300.0" y="451.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f3046">API cria protocolo e</text>
<text x="300.0" y="472.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f3046">coloca pedido na fila</text>
<rect x="20" y="545" width="270" height="66" rx="6" fill="#eef3fa" stroke="#7186a1"/>
<text x="155.0" y="572.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f3046">Responder 202 e protocolo</text>
<text x="155.0" y="593.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f3046">Liberar formulário</text>
<rect x="345" y="545" width="270" height="66" rx="6" fill="#eef3fa" stroke="#7186a1"/>
<text x="480.0" y="572.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f3046">Consumidor retira pedido</text>
<text x="480.0" y="593.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f3046">e chama serviço acadêmico</text>
<rect x="345" y="665" width="270" height="74" rx="6" fill="#eef3fa" stroke="#7186a1"/>
<text x="480.0" y="686.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f3046">Serviço confere duplicidade</text>
<text x="480.0" y="707.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f3046">e registra a matrícula</text>
<text x="480.0" y="728.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f3046">ou retorna erro</text>
<rect x="345" y="790" width="270" height="66" rx="6" fill="#eef3fa" stroke="#7186a1"/>
<text x="480.0" y="817.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f3046">Consumidor salva resultado</text>
<text x="480.0" y="838.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f3046">associado ao protocolo</text>
<rect x="20" y="790" width="270" height="66" rx="6" fill="#eef3fa" stroke="#7186a1"/>
<text x="155.0" y="817.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f3046">Página consulta protocolo</text>
<text x="155.0" y="838.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f3046">GET /api/pedidos/ID</text>
<polygon points="155.0,920 255,975.0 155.0,1030 55,975.0" fill="#fff7e2" stroke="#9b7826"/>
<text x="155.0" y="980.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f3046">Finalizado?</text>
<rect x="20" y="1100" width="270" height="70" rx="6" fill="#eef3fa" stroke="#7186a1"/>
<text x="155.0" y="1129.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f3046">Exibir matrícula concluída</text>
<text x="155.0" y="1150.5" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f3046">ou falha</text>
<rect x="365" y="937" width="230" height="66" rx="6" fill="#eef3fa" stroke="#7186a1"/>
<text x="480.0" y="975.0" text-anchor="middle" font-family="Arial" font-size="16" fill="#1f3046">Aguardar 700 ms</text>
<rect x="20" y="1240" width="270" height="48" rx="24.0" fill="#194374" stroke="#7186a1"/>
<text x="155.0" y="1269.0" text-anchor="middle" font-family="Arial" font-size="16" fill="white">Fim</text>
